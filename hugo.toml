baseURL = "camegone-self-introduction.camegone-cf.workers.dev/"   # ← 実際のドメインに書き換えてください（末尾は / のまま）
title = "camegone"
locale = "ja-JP"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]   # tags/categories等の未使用ページを生成しない

[languages]
  [languages.ja]
    label = "日本語"
    weight = 1
    contentDir = "content/ja"
    locale = "ja-JP"
  [languages.en]
    label = "English"
    weight = 2
    contentDir = "content/en"
    locale = "en-US"
  [languages.eo]
    label = "Esperanto"
    weight = 3
    contentDir = "content/eo"
    locale = "eo"

[outputs]
  home = ["HTML"]

[caches]
  [caches.images]
    dir = ":cacheDir/images"

[params]
  # サイト全体で使う値があればここに追加できます
