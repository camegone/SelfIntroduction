baseURL = "https://example.com/"   # ← 実際のドメインに書き換えてください（末尾は / のまま）
title = "camegone"
languageCode = "ja-JP"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
enableRobotsTXT = true

[languages]
  [languages.ja]
    languageName = "日本語"
    weight = 1
    contentDir = "content/ja"
    languageCode = "ja-JP"
  [languages.en]
    languageName = "English"
    weight = 2
    contentDir = "content/en"
    languageCode = "en-US"
  [languages.eo]
    languageName = "Esperanto"
    weight = 3
    contentDir = "content/eo"
    languageCode = "eo"

[outputs]
  home = ["HTML"]

[caches]
  [caches.images]
    dir = ":cacheDir/images"

[params]
  # サイト全体で使う値があればここに追加できます
